services:
  postgres:
    image: postgres:15-alpine
    container_name: sarcomfasttrack-postgres
    environment:
      POSTGRES_DB: sarcomfasttrack
      POSTGRES_USER: sarcomfasttrack
      POSTGRES_PASSWORD: sarcomfasttrack
    ports:
      - "5433:5432"  # Use 5433 to avoid conflicts with other PostgreSQL instances
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarcomfasttrack"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sarcomfasttrack-network

  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
    env_file:
      - .env
      - .env.docker
    environment:
      # Database configuration - explicitly override env_file values for Docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sarcomfasttrack
      DB_USER: sarcomfasttrack
      DB_PASSWORD: sarcomfasttrack
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - sarcomfasttrack-network

volumes:
  postgres_data:

networks:
  sarcomfasttrack-network:
    name: sarcomfasttrack-network
    driver: bridge
