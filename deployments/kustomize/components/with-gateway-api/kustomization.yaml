apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - http-route.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: sarcoma-fasttrack-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/1/env/1/value
        value: /sarcoma-fasttrack-openapi
      - op: replace
        path: /spec/template/spec/containers/1/env/2/value
        value: /sarcoma-fasttrack-openapi-ui
