services:
  mongo_db:
    image: mongo:7
    container_name: sarcoma_mongo_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - db_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${SARCOMA_API_MONGODB_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${SARCOMA_API_MONGODB_PASSWORD:-admin}

  mongo_express:
    image: mongo-express:1
    container_name: sarcoma_mongo_express
    restart: unless-stopped
    depends_on:
      - mongo_db
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${SARCOMA_API_MONGODB_USERNAME:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${SARCOMA_API_MONGODB_PASSWORD:-admin}
      ME_CONFIG_MONGODB_SERVER: mongo_db
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-mexpress}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-mexpress}

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: sarcoma_api
    restart: unless-stopped
    depends_on:
      - mongo_db
    ports:
      - "8000:8000"
    environment:
      SARCOMA_API_ENVIRONMENT: development
      SARCOMA_API_PORT: "8000"
      SARCOMA_API_STORE: mongo
      SARCOMA_API_MONGODB_URI: mongodb://${SARCOMA_API_MONGODB_USERNAME:-admin}:${SARCOMA_API_MONGODB_PASSWORD:-admin}@mongo_db:27017/?authSource=admin
      SARCOMA_API_MONGODB_DATABASE: ${SARCOMA_API_MONGODB_DATABASE:-sarcoma-fasttrack}
      SARCOMA_API_MONGODB_COLLECTION: ${SARCOMA_API_MONGODB_COLLECTION:-state}

volumes:
  db_data: {}
